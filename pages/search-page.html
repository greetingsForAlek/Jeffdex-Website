<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Search</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="search-container">
        <input type="text" id="search-bar" placeholder="Search characters...">

        <select id="alignment-filter">
            <option value="">All Alignments</option>
            <option value="Good">Good</option>
            <option value="Neutral">Neutral</option>
            <option value="Bad">Bad</option>
        </select>

        <select id="canon-filter">
            <option value="">All Characters</option>
            <option value="true">Canon</option>
            <option value="false">Non-Canon</option>
        </select>

        <button id="search-button">Search</button>
    </div>

    <div id="search-grid"></div>

    <script src="js/search.js"></script>
</body>
</html>
